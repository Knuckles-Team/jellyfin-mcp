---
services:
  jellyfin-agent:
    # image: docker.io/knucklessg1/jellyfin:latest
    build:
      context: . # Debug
      dockerfile: debug.Dockerfile
    container_name: jellyfin-agent
    hostname: jellyfin-agent
    command: [ "jellyfin-agent" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    env_file:
      - .env
    environment:
      - "HOST=0.0.0.0"
      - "PORT=9056"
      - "TRANSPORT=stdio"
      - "JELLYFIN_INSTANCE=${JELLYFIN_INSTANCE}"
      - "JELLYFIN_ACCESS_TOKEN=${JELLYFIN_ACCESS_TOKEN}"
      - "JELLYFIN_VERIFY=${JELLYFIN_VERIFY:-True}"
      - "PROVIDER=openai"
      - "LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      - "LLM_API_KEY=${LLM_API_KEY:-llama}"
      - "MODEL_ID=${MODEL_ID:-qwen/qwen3.5-35b-a3b}"
      - "DEBUG=False"
      - "ENABLE_WEB_UI=True"
      - "ENABLE_OTEL=True"
    ports:
      - "9056:9056"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9056/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
