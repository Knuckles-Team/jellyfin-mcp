[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-mcp"
version = "2.3.1"
description = "Jellyfin MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0",]
all = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
jellyfin-mcp = "jellyfin_mcp.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
jellyfin-mcp = "jellyfin_mcp.skills"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
jellyfin-mcp = "jellyfin_mcp.connectors"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# agent-connector-sdk hub (http://knuckles.team/kg/media). Resolved via
# iter_provider_dirs like the skill/prompt providers.
[project.entry-points."agent_connector_sdk.ontology_providers"]
jellyfin-mcp = "jellyfin_mcp.ontology"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
jellyfin-mcp = "jellyfin_mcp"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
jellyfin_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
